# yaml-language-server: $schema=../docs/config.schema.json
# Mounted by examples/docker-compose.yaml. Do not put secrets in this file.
server:
  host: 0.0.0.0
  port: 3000
  path: /mcp

database:
  url: ${DATABASE_URL}

security:
  authentication:
    type: bearer
    token: ${MCP_TOKEN}
    resource: http://127.0.0.1:3000/mcp

  readonly: true

  http:
    allowedHosts:
      - localhost
      - 127.0.0.1
      - "[::1]"

  access:
    schemas:
      allow:
        - public
    tables:
      deny:
        - public.user_credentials

  queries:
    timeoutMs: 10000
    maxRows: 1000
    maxConcurrent: 3
    singleStatement: true

  introspection:
    enabled: true
    expandViews: true

logging:
  level: info
  logQueries: false
